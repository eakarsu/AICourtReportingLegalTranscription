name: ci
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: postgres, POSTGRES_DB: app_test }
        ports: ['5432:5432']
        options: --health-cmd="pg_isready -U postgres" --health-interval=10s --health-timeout=5s --health-retries=5
    env: { DATABASE_URL: 'postgres://postgres:postgres@localhost:5432/app_test', JWT_SECRET: 'ci-only-secret-with-at-least-32-characters' }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm, cache-dependency-path: server/package-lock.json }
      - run: npm ci && npm test
        working-directory: server
      - run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f server/migrations/001_certified_transcript_workflow.sql
      - run: npm ci && npm run build
        working-directory: client
